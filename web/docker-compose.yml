services:
  vitalix-db:
    container_name: vitalix-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitalix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitalix}
      POSTGRES_DB: ${POSTGRES_DB:-vitalix}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["vitalix_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalix}"]
      interval: 3s
      timeout: 3s
      retries: 10
  vitalis-app:
    container_name: vitalix-app
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitalix}:${POSTGRES_PASSWORD:-vitalix}@vitalix-db:5432/${POSTGRES_DB:-vitalix}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
    ports: ["${PORT:-3000}:${PORT:-3000}"]
    depends_on:
      vitalix-db:
        condition: service_healthy

volumes:
  vitalix_pgdata:
