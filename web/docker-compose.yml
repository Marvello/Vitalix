services:
  vitalix-db:
    container_name: vitalix-db
    image: postgres:18-alpine
    env_file: .env
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["vitalix_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalix}"]
      interval: 3s
      timeout: 3s
      retries: 10
  vitalix-app:
    container_name: vitalix-app
    # Prebuilt by CI (.github/workflows/web.yml) and published to GHCR.
    # Override the tag/registry with VITALIX_IMAGE if needed.
    image: ${VITALIX_IMAGE:-ghcr.io/marvello/vitalix-web:latest}
    pull_policy: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitalix}:${POSTGRES_PASSWORD:-vitalix}@vitalix-db:5432/${POSTGRES_DB:-vitalix}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    ports: ["${PORT:-3000}:${PORT:-3000}"]
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      vitalix-db:
        condition: service_healthy

volumes:
  vitalix_pgdata:
