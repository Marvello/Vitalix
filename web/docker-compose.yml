services:
  vitalix-db:
    container_name: vitalix-db
    image: postgres:17-alpine
    env_file: .env
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["vitalix_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vitalix}"]
      interval: 3s
      timeout: 3s
      retries: 10
  vitalix-app:
    container_name: vitalix-app
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vitalix}:${POSTGRES_PASSWORD:-vitalix}@vitalix-db:5432/${POSTGRES_DB:-vitalix}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    ports: ["${PORT:-3000}:${PORT:-3000}"]
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      vitalix-db:
        condition: service_healthy

volumes:
  vitalix_pgdata:
