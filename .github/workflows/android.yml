name: android

# Unit tests + debug build for the Android app (android/). No signing, no secrets;
# releases still go through fastlane.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "docs/fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25 # Gradle 9.9 runtime; the app itself compiles Java 11
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testProductionDebugUnitTest assembleProductionDebug

  # Submit the resolved Gradle dependency graph so Dependabot alerts cover the
  # Android app (GitHub can't parse build.gradle.kts on its own).
  dependencies:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: android
