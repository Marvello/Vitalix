name: android

# Unit tests + debug build for the Android app (android/). No signing, no secrets;
# releases still go through fastlane.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Gradle 9.5 runtime; the app itself compiles Java 11
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testProductionDebugUnitTest assembleProductionDebug
